<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelManager Pro</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pyidaungsu Font CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Excel & PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- App Container -->
    <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar glass-panel" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <img src="https://lh3.googleusercontent.com/d/1mDAnPBjTHZt7gLeI1etXZBhlhnlPOhGz" alt="Logo" class="sidebar-logo-img">
                </div>
                <h2 class="logo-text">FuelPro</h2>
                <button class="mobile-close-btn" id="mobile-close">✖</button>
            </div>
            
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" data-path="/dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="#/fuel" class="nav-item" data-path="/fuel">
                    <span class="nav-icon">💧</span>
                    <span class="nav-text">Fuel Entry</span>
                </a>
                <a href="#/draft" class="nav-item" data-path="/draft">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Drafts</span>
                </a>
                <a href="#/inventory" class="nav-item" data-path="/inventory">
                    <span class="nav-icon">📦</span>
                    <span class="nav-text">Inventory</span>
                </a>
                <a href="#/reports" class="nav-item" data-path="/reports">
                    <span class="nav-icon">📑</span>
                    <span class="nav-text">Reports</span>
                </a>
                <a href="#/settings" class="nav-item" data-path="/settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="nav-item text-danger" id="logout-btn">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content Wrapper -->
        <div class="main-content">
            
            <!-- Navbar -->
            <header class="navbar glass-panel">
                <div class="nav-left">
                    <button class="menu-toggle" id="menu-toggle">☰</button>
                    <h2 class="page-title" id="page-title">Dashboard</h2>
                </div>
                
                <div class="nav-right">
                    <button id="theme-toggle" class="icon-btn theme-btn-small" aria-label="Toggle Theme">
                        <span id="theme-icon">🌙</span>
                    </button>
                    <div class="user-profile">
                        <div id="user-avatar" class="avatar-circle">A</div>
                        <span id="user-name">Admin</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic Router View -->
            <main class="router-view" id="app-content">
                <div class="skeleton-loader">
                    <p>Loading application...</p>
                </div>
            </main>
            
        </div>
    </div>

    <!-- Voucher Hidden Template -->
    <div id="voucher-card-container">
        <div id="voucher-card">
            
            <!-- Header Section -->
            <div class="vc-header">
                <div class="vc-logo-box">
                    <img id="vc-logo" 
                         src="https://lh3.googleusercontent.com/d/1mDAnPBjTHZt7gLeI1etXZBhlhnlPOhGz" 
                         alt="Logo">
                </div>
                
                <h2 class="vc-title">Fuel Entry Voucher</h2>
                <span id="vc-id">ID: -</span>
            </div>

            <!-- Details Content Section -->
            <div class="vc-body">
                
                <div class="vc-row">
                    <strong class="vc-label">🛥️ Boat ID:</strong> 
                    <span id="vc-boat" class="vc-value">-</span>
                </div>

                <div class="vc-row-top">
                    <strong class="vc-label">🏢 Dept:</strong> 
                    <span id="vc-dept">-</span>
                </div>
                
                <div class="vc-itinerary-box">
                    <strong class="vc-label-flex">📍 Itineraries:</strong> 
                    <span id="vc-itineraries">-</span>
                </div>

                <div class="vc-row">
                    <strong class="vc-label">⛽ Liter:</strong> 
                    <span id="vc-liter">0 L</span>
                </div>

                <div class="vc-row">
                    <strong class="vc-label">📅 Date:</strong> 
                    <span id="vc-date">-</span>
                </div>

            </div>

            <!-- Voucher Attachment Photo -->
            <div id="vc-photo-box">
                <div class="vc-photo-title">🖼️ Voucher Attachment</div>
                <img id="vc-img" src="" alt="Voucher Attachment" />
            </div>

        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Core Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
